[project]
name = "qwen3-vl-data-generation"
version = "1.0.0"
description = "Qwen3-VL Fine-tuning 데이터셋 생성 파이프라인"
requires-python = ">=3.9"
dependencies = [
    # 데이터베이스
    "pymysql>=1.1.0",
    # 데이터 처리
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # 이미지 처리
    "pillow>=10.0.0",
    "requests>=2.31.0",
    # 설정 파일
    "pyyaml>=6.0",
    # OpenAI API
    "openai>=1.0.0",
    # 로깅 및 유틸리티
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
generate-dataset = "generate_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
include = [
    "*.py",
    "config.yaml",
    "README.md",
]
exclude = [
    "tests/",
    "images/",
    "*.pyc",
    "__pycache__/",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

